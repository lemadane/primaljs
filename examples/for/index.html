<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimalJS — Declarative For Loop Demo</title>
    <link rel="stylesheet" href="../hello/app.css">
    <style>
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .user-grid {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }
        .user-card {
            padding: 16px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .empty-card {
            padding: 24px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px dashed #ef4444;
            color: #ef4444;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="app"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
