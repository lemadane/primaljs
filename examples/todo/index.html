<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimalJS — Todo Demo</title>
    <link rel="stylesheet" href="../hello/app.css">
    <style>
        .todo-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .input-text {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .input-text:focus {
            border-color: #6366f1;
        }
        .todo-list {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .todo-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .todo-item.completed span {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .del-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div id="app"></div>

<script type="module" src="./app.js"></script>

</body>
</html>
