name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release
    if: github.repository == 'lemadane/primaljs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/release-metadata.js >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution bundles
        run: npm run build

      - name: Verify release validation
        run: node --test test/release_metadata.test.js

      - name: Run unit tests
        run: npm test

      - name: Verify application examples
        run: npm run test:examples

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish using npm trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
